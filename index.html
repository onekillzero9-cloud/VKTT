<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vạn Kiếp Tu Tiên - MOD Panel</title>

    <!-- Cấu hình ứng dụng Web App cho iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tu Tiên MOD">
    <link rel="apple-touch-icon" href="https://vankiheptutien.com/favicon.ico">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Khung tải Game -->
    <iframe id="game-frame" src="https://vankiheptutien.com"></iframe>

    <script>
        const iframe = document.getElementById('game-frame');

        // Hàm tự động tiêm Script Cheat vào trong Game
        function injectCheat() {
            try {
                const gameWindow = iframe.contentWindow;
                const gameDoc = iframe.contentDocument || gameWindow.document;

                if (!gameWindow.game || !gameWindow.game.store) {
                    setTimeout(injectCheat, 1000); // Đợi game load xong store
                    return;
                }

                // Tiêm script quản lý
                const script = gameDoc.createElement('script');
                script.textContent = `
                (function() {
                    if (document.getElementById('tu-tien-floating-panel')) return;

                    let panel = document.createElement('div');
                    panel.id = 'tu-tien-floating-panel';
                    panel.style.cssText = \`
                        position: fixed; top: 20px; right: 20px; z-index: 999999;
                        background: rgba(15, 15, 25, 0.96); color: #00ffcc; padding: 12px;
                        border-radius: 8px; font-family: monospace; font-size: 12px;
                        box-shadow: 0 4px 20px rgba(0,0,0,0.7); border: 1px solid #00ffcc;
                        width: 310px; user-select: none; -webkit-user-select: none;
                    \`;

                    function renderPanel(minimized) {
                        if (minimized) {
                            panel.style.width = 'auto';
                            panel.style.padding = '6px 8px';
                            panel.innerHTML = \`
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span id="p-drag" style="color: #ffaa00; font-size: 14px; background: rgba(255,170,0,0.15); padding: 4px 8px; border-radius: 4px; cursor: move;">⋮⋮ Kéo</span>
                                    <span id="p-exp" style="cursor: pointer; background: #ffaa00; color: #000; font-size: 16px; font-weight: bold; padding: 3px 12px; border-radius: 4px;">+</span>
                                </div>
                            \`;
                            gameDoc.getElementById('p-exp').onclick = () => renderPanel(false);
                        } else {
                            panel.style.width = '310px';
                            panel.style.padding = '12px';
                            panel.innerHTML = \`
                                <div id="p-hdr" style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: move;">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <span style="color: #ffaa00; font-size: 14px;">⋮⋮</span>
                                        <span>⚡ BẢNG QUẢN LÝ TỰ DO</span>
                                    </div>
                                    <div style="display: flex; gap: 6px;">
                                        <span id="p-tgl" style="cursor: pointer; color: #ffaa00; font-weight: bold; padding: 2px 8px; background: rgba(255,170,0,0.15); border-radius: 3px;">[-]</span>
                                        <span id="p-cls" style="cursor: pointer; color: #ff5555; padding: 2px 5px; background: rgba(255,85,85,0.1); border-radius: 3px;">✕</span>
                                    </div>
                                </div>
                                <div id="p-bdy" style="max-height: 75vh; overflow-y: auto;">
                                    <div style="margin-bottom: 10px; background: rgba(0,255,204,0.05); padding: 6px; border-radius: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                                        <div>Linh Thạch: <b id="panel-lt" style="color: #fff;">0</b></div>
                                        <div>Tu Vi: <b id="panel-tv" style="color: #fff;">0</b></div>
                                        <div>Cảnh Giới: <b id="panel-cg" style="color: #fff;">0</b></div>
                                        <div>Cống Hiến: <b id="panel-ch" style="color: #fff;">0</b></div>
                                        <div>Tuổi: <b id="panel-tuoi" style="color: #fff;">0</b></div>
                                        <div>Thọ Nguyên Thêm: <b id="panel-thonguyenthem" style="color: #fff;">0</b></div>
                                    </div>
                                    <div style="margin-bottom: 10px; background: rgba(0,255,204,0.05); padding: 6px; border-radius: 4px;">
                                        <div>Thể Chất: <b id="panel-thechat-hien-tai" style="color: #ffaa00;">Đang tải...</b></div>
                                        <div style="margin-top: 4px;">Linh Căn: <b id="panel-linhcan" style="color: #ffaa00;">Đang tải...</b></div>
                                    </div>
                                    <div style="font-weight: bold; margin-bottom: 6px; color: #ffaa00;">💰 Tài Nguyên:</div>
                                    <div style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;">
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Linh Thạch:</span><input type="number" id="input-lt" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-lt" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Tu Vi:</span><input type="number" id="input-tv" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-tv" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Cống Hiến:</span><input type="number" id="input-ch" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-ch" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Thọ Nguyên:</span><input type="number" id="input-tnt" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-tnt" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                    </div>
                                    <div style="font-weight: bold; margin-bottom: 6px; border-top: 1px solid #333; padding-top: 6px; color: #ffaa00;">🧬 Thể Chất:</div>
                                    <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 10px; background: rgba(255,170,0,0.05); padding: 6px;">
                                        <select id="select-thechat" style="flex:1; background: #111; color: #00ffcc; border: 1px solid #444; padding: 4px;">
                                            <option value="the_chat.pham_the">Phàm Thể</option>
                                            <option value="the_chat.bach_thao">Bách Thảo Thể</option>
                                            <option value="the_chat.thiet_cot">Thiết Cốt Thể</option>
                                            <option value="the_chat.kiem_cot">Kiếm Cốt Thể</option>
                                            <option value="the_chat.hoang_co">Hoang Cổ Thể</option>
                                            <option value="the_chat.cuu_am">Cửu Âm Thể</option>
                                        </select>
                                        <button id="btn-thechat" style="background: #ffaa00; color: #000; border: none; padding: 5px 10px; font-weight: bold;">Gán</button>
                                    </div>
                                    <div style="font-weight: bold; margin-bottom: 6px; border-top: 1px solid #333; padding-top: 6px; color: #ffaa00;">🌱 Linh Căn:</div>
                                    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; background: rgba(255,170,0,0.05); padding: 6px;">
                                        <div style="display: flex; justify-content: space-between;"><label><input type="checkbox" name="linhcan-he" value="kim"> Kim</label><label><input type="checkbox" name="linhcan-he" value="moc"> Mộc</label><label><input type="checkbox" name="linhcan-he" value="thuy"> Thủy</label></div>
                                        <div style="display: flex; justify-content: space-between;"><label><input type="checkbox" name="linhcan-he" value="hoa"> Hỏa</label><label><input type="checkbox" name="linhcan-he" value="tho"> Thổ</label><label style="color: #70dbff;"><input type="checkbox" name="linhcan-he" value="bang"> Băng</label></div>
                                        <div style="display: flex; justify-content: space-between;"><label style="color: #aaffaa;"><input type="checkbox" name="linhcan-he" value="phong"> Phong</label><label style="color: #ffff70;"><input type="checkbox" name="linhcan-he" value="loi"> Lôi</label><span style="width: 50px;"></span></div>
                                        <div style="display: flex; gap: 4px; margin-top: 4px;">
                                            <button id="btn-gan-linhcan" style="flex:1; background: #ffaa00; color: #000; border: none; padding: 4px; font-weight: bold;">Gán Linh Căn</button>
                                            <button id="btn-go-linhcan" style="background: #222; color: #ff5555; border: 1px solid #ff5555; padding: 4px 8px; font-weight: bold;">Gỡ</button>
                                        </div>
                                    </div>
                                    <div style="font-weight: bold; margin-bottom: 6px; border-top: 1px solid #333; padding-top: 6px; color: #ffaa00;">📊 Chỉ Số:</div>
                                    <div style="display: flex; flex-direction: column; gap: 5px;">
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Ngộ tính:</span><input type="number" id="input-ngo-tinh" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-ngo-tinh" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Căn cốt:</span><input type="number" id="input-can-cot" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-can-cot" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Đạo tâm:</span><input type="number" id="input-dao-tam" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-dao-tam" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Thân pháp:</span><input type="number" id="input-than-phap" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-than-phap" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Khí vận:</span><input type="number" id="input-khi-van" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-khi-van" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Tâm ma:</span><input type="number" id="input-tam-ma" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-tam-ma" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                        <div style="display: flex; gap: 4px; align-items: center;"><span style="width: 100px;">Thần thức:</span><input type="number" id="input-than-thuc" placeholder="Số" style="flex:1; background: #111; color: #fff; border: 1px solid #444; padding: 3px;"><button id="btn-than-thuc" style="background: #ffaa00; color: #000; border: none; padding: 3px 8px; font-weight: bold;">Gán</button></div>
                                    </div>
                                </div>
                            \`;
                            document.getElementById('p-tgl').onclick = () => renderPanel(true);
                            document.getElementById('p-cls').onclick = () => panel.remove();

                            let uN = (k, v) => { let run = window.game.store.getState().run; window.game.store.setState({ run: { ...run, nhanVat: { ...run.nhanVat, [k]: v } } }); };
                            let uC = (k, v) => { let run = window.game.store.getState().run; let cs = run.nhanVat.chiSo || {}; window.game.store.setState({ run: { ...run, nhanVat: { ...run.nhanVat, chiSo: { ...cs, [k]: v } } } }); };

                            document.getElementById('btn-lt').onclick = () => { let v = parseInt(document.getElementById('input-lt').value); if (!isNaN(v)) uN('linhThach', v); };
                            document.getElementById('btn-tv').onclick = () => { let v = parseInt(document.getElementById('input-tv').value); if (!isNaN(v)) uN('tuVi', v); };
                            document.getElementById('btn-ch').onclick = () => { let v = parseInt(document.getElementById('input-ch').value); if (!isNaN(v)) uN('congHien', v); };
                            document.getElementById('btn-tnt').onclick = () => { let v = parseInt(document.getElementById('input-tnt').value); if (!isNaN(v)) uN('thoNguyenThem', v); };

                            document.getElementById('btn-thechat').onclick = () => { let v = document.getElementById('select-thechat').value; if (v) uN('theChat', v); };

                            window._isUpdatingLinhCan = false;
                            document.getElementById('btn-gan-linhcan').onclick = () => {
                                let sel = [];
                                document.querySelectorAll('input[name="linhcan-he"]:checked').forEach(cb => sel.push(cb.value));
                                if (!sel.length) return alert('Chọn ít nhất 1 hệ!');
                                let bd = ['bang', 'phong', 'loi'].some(h => sel.includes(h)), np = 'tap', tl = 1.0, dp = 0;
                                if (bd) { np = 'bien_di'; tl = 1.2; }
                                else if (sel.length === 1) { np = 'thien'; tl = 1.3; dp = 0.1; }
                                else if (sel.length === 2) { np = 'song'; tl = 1.0; }
                                else { np = 'tap'; tl = 0.8; dp = -0.05; }
                                window._isUpdatingLinhCan = true;
                                let run = window.game.store.getState().run;
                                window.game.store.setState({ run: { ...run, nhanVat: { ...run.nhanVat, linhCan: { ...run.nhanVat.linhCan, pham: np, he: sel, isBienDi: bd, tuLuyen: tl, dotPha: dp } } } });
                                setTimeout(() => window._isUpdatingLinhCan = false, 1500);
                            };

                            document.getElementById('btn-go-linhcan').onclick = () => {
                                window._isUpdatingLinhCan = true;
                                let run = window.game.store.getState().run;
                                window.game.store.setState({ run: { ...run, nhanVat: { ...run.nhanVat, linhCan: { ...run.nhanVat.linhCan, pham: 'vo', he: [], isBienDi: false, tuLuyen: 0.5, dotPha: 0 } } } });
                                document.querySelectorAll('input[name="linhcan-he"]').forEach(cb => cb.checked = false);
                                setTimeout(() => window._isUpdatingLinhCan = false, 1500);
                            };

                            ['ngo_tinh', 'can_cot', 'dao_tam', 'than_phap', 'khi_van', 'tam_ma', 'than_thuc'].forEach(k => {
                                let btn = document.getElementById('btn-' + k.replace('_', '-'));
                                if (btn) btn.onclick = () => { let v = parseInt(document.getElementById('input-' + k.replace('_', '-')).value); if (!isNaN(v)) uC(k, v); };
                            });
                        }
                    }

                    document.body.appendChild(panel);
                    renderPanel(false);

                    let isD = false, sX, sY, iX, iY;
                    function sD(cX, cY, t) {
                        if (t.id === 'p-hdr' || t.id === 'p-drag' || t.closest('#p-hdr')) {
                            if (['p-tgl', 'p-cls', 'p-exp'].includes(t.id) || ['INPUT', 'SELECT', 'LABEL'].includes(t.tagName)) return false;
                            isD = true; sX = cX; sY = cY; iX = panel.offsetLeft; iY = panel.offsetTop; return true;
                        }
                        return false;
                    }
                    function oD(cX, cY) {
                        if (!isD) return;
                        panel.style.left = (iX + cX - sX) + 'px';
                        panel.style.top = (iY + cY - sY) + 'px';
                        panel.style.right = 'auto';
                    }

                    panel.onmousedown = e => { if (sD(e.clientX, e.clientY, e.target)) { document.onmousemove = e => oD(e.clientX, e.clientY); document.onmouseup = () => { isD = false; document.onmousemove = null; document.onmouseup = null; }; } };
                    panel.addEventListener('touchstart', e => { if (e.touches.length === 1) sD(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
                    panel.addEventListener('touchmove', e => { if (isD && e.touches.length === 1) oD(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
                    panel.addEventListener('touchend', () => isD = false);

                    setInterval(() => {
                        try {
                            let nv = window.game.store.getState().run.nhanVat;
                            if (document.getElementById('panel-lt')) {
                                document.getElementById('panel-lt').innerText = nv.linhThach ?? 0;
                                document.getElementById('panel-tv').innerText = nv.tuVi ?? 0;
                                document.getElementById('panel-cg').innerText = nv.canhGioi ?? 0;
                                document.getElementById('panel-ch').innerText = nv.congHien ?? 0;
                                document.getElementById('panel-tuoi').innerText = Math.floor(nv.tuoi ?? 0);
                                document.getElementById('panel-thonguyenthem').innerText = nv.thoNguyenThem ?? 0;
                                if (document.getElementById('panel-thechat-hien-tai')) document.getElementById('panel-thechat-hien-tai').innerText = nv.theChat ?? 'Không';
                                if (nv.linhCan) {
                                    let h = nv.linhCan.he || [];
                                    document.getElementById('panel-linhcan').innerText = (h.length ? h.join(',') : 'Vô') + (nv.linhCan.tuLuyen ? \` (x\${nv.linhCan.tuLuyen})\` : '');
                                    if (!window._isUpdatingLinhCan && !document.activeElement.name) document.querySelectorAll('input[name="linhcan-he"]').forEach(cb => cb.checked = h.includes(cb.value));
                                }
                            }
                        } catch (e) {}
                    }, 1000);
                })();
                `;
                gameDoc.body.appendChild(script);
            } catch (e) {
                console.log("Đang đợi nạp Game...");
            }
        }

        iframe.onload = injectCheat;
    </script>
</body>
</html>
